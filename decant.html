<!DOCTYPE html>
<html lang="en" data-backdrop="peach">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>Decant</title>
<!--
==========================================================================
  DECANT - a water sort puzzle in one file
==========================================================================
  SECTION MAP (search for the code, e.g. "S6" or "C4", to jump there)

  STYLE (the style block)
    S1  Fonts ................ font families and weights
    S2  Colours .............. default light and dark scheme, liquid sets,
                               fixed colours (gold, cork, coin, gloss)
    S3  Shop backdrops ....... one colour scheme per backdrop
    S4  Glass buttons/cards .. the frosted "liquid glass" look
    S5  Game layout .......... page column, top bar, board, action buttons
    S6  Tubes and liquid ..... tube shapes (one block per shop tube), bands
    S7  Home / shop / pop-ups
    S8  Animations ........... CSS timings and keyframes

  PAGE (the body)
    P1  Game screen
    P2  Home screen
    P3  Shop screen
    P4  Pop-ups (win, awards) and the symbol shapes

  SETTINGS (first script block: the CONFIG object)
    C1  Text ................. every label and message
    C2  Images ............... optional picture paths ("" = built-in drawing)
    C3  Levels ............... capacity, empty tubes, colours per level, coins
    C4  Shop ................. tubes, backdrops, colour sets
    C5  Awards
    C6  Sound and vibration
    C7  Animation timings .... the pour sequence and confetti (CSS timings are in S8)
    C8  Layout numbers ....... tube proportions used to fit the board

  ENGINE (second script block)  puzzle rules, level generator, solver.
                               No screen code. Reads its numbers from CONFIG.
  SCREENS (third script block)  drawing, touch, sound, saving, shop, awards.

  HOW THINGS LINK UP
    - A shop tube "id" in C4 matches a [data-tube="id"] block in S6.
    - A backdrop "id" in C4 matches a [data-backdrop="id"] block in S3.
    - A colour set "id" in C4 matches a [data-colours="id"] block in S2.
    To add one, add both the CSS block and the CONFIG entry.
==========================================================================
-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700;12..96,800&family=Instrument+Sans:wght@400..700&display=swap" rel="stylesheet">

<style>
/* =======================================================================
   S1  FONTS
   ======================================================================= */
:root {
  --font-display: "Bricolage Grotesque", "Avenir Next", "Segoe UI", system-ui, sans-serif; /* title, level numbers, headings */
  --font-body: "Instrument Sans", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; /* everything else */
  --fw-display: 800;   /* weight of headings */
  --fw-strong: 600;    /* weight of button labels */
}

/* =======================================================================
   S2  COLOURS
   The "aurora" backdrop has a light and a dark version that
   follow the device theme. Every colour used anywhere is a variable here
   or in S3.
   ======================================================================= */
:root, [data-backdrop="aurora"] {
  color-scheme: light;
  --bg-base: #eef0fb;                       /* page base colour */
  --blob-1: #ffc4dc;                        /* top-left wash */
  --blob-2: #b5d9ff;                        /* right wash */
  --blob-3: #c4f3d9;                        /* bottom wash */
  --text: #1b2140;                          /* main text */
  --text-soft: #535d86;                     /* secondary text */
  --accent: #5566f5;                        /* accent (focus, hint outline, glow) */
  --accent-glass: rgba(85, 102, 245, .78);  /* tinted glass: Play button, selected tab */
  --accent-ink: #ffffff;                    /* text on tinted glass */
  --accent-glow: rgba(85, 102, 245, .45);   /* glow tube halo */
  --glass-fill: rgba(255, 255, 255, .42);   /* frosted fill */
  --glass-rim: rgba(255, 255, 255, .88);    /* bright 1px rim */
  --glass-shadow: rgba(38, 48, 110, .16);   /* soft drop shadow */
  --glass-highlight: rgba(255, 255, 255, .95); /* inner top highlight */
  --card-fill: rgba(255, 255, 255, .72);    /* pop-up cards (more solid) */
  --scrim: rgba(28, 34, 70, .30);           /* dim layer behind pop-ups */
  --tube-fill: rgba(255, 255, 255, .30);    /* empty glass */
  --tube-outline: rgba(58, 70, 130, .55);   /* tube outline */
  --tube-shadow: rgba(38, 48, 110, .18);    /* tube shadow */
  --tube-shine: rgba(255, 255, 255, .65);   /* vertical shine stripe */
  --shelf: rgba(58, 70, 130, .30);          /* shelf line */
  --focus: #1b2140;                         /* keyboard focus ring */
  --ok: #1c9a5e;                            /* earned award tick */
}
@media (prefers-color-scheme: dark) {
  :root, [data-backdrop="aurora"] {
    color-scheme: dark;
    --bg-base: #101228;
    --blob-1: #5b2a70;
    --blob-2: #1d4788;
    --blob-3: #17635b;
    --text: #f2f4ff;
    --text-soft: #aab2d8;
    --accent: #8b98ff;
    --accent-glass: rgba(110, 124, 255, .62);
    --accent-ink: #ffffff;
    --accent-glow: rgba(139, 152, 255, .55);
    --glass-fill: rgba(255, 255, 255, .09);
    --glass-rim: rgba(255, 255, 255, .28);
    --glass-shadow: rgba(0, 0, 0, .38);
    --glass-highlight: rgba(255, 255, 255, .24);
    --card-fill: rgba(36, 40, 78, .80);
    --scrim: rgba(4, 6, 20, .58);
    --tube-fill: rgba(255, 255, 255, .07);
    --tube-outline: rgba(255, 255, 255, .55);
    --tube-shadow: rgba(0, 0, 0, .38);
    --tube-shine: rgba(255, 255, 255, .34);
    --shelf: rgba(255, 255, 255, .24);
    --focus: #ffffff;
    --ok: #55d99a;
  }
}

/* Fixed colours: the same on every backdrop */
:root {
  --gold: #d9a520;                       /* gilded tube, coin */
  --gold-light: #ffe28a;                 /* coin and gilded highlight */
  --gold-deep: #a87508;                  /* coin edge */
  --cork-light: #d9b98a;                 /* cork highlight */
  --cork: #b88a52;                       /* cork */
  --cork-deep: #8a6234;                  /* cork shadow side */
  --gloss-light: rgba(255, 255, 255, .34); /* left side of the liquid gloss */
  --gloss-dark: rgba(0, 0, 0, .14);      /* right side of the liquid gloss */
  --surface-line: rgba(255, 255, 255, .6); /* light line on the top band */
  --sym-fill: #ffffff;                   /* colour-blind symbol fill */
  --sym-line: rgba(0, 0, 0, .55);        /* colour-blind symbol outline */
  --hand-fill: #ffffff;                  /* tutorial hand */
  --hand-line: #1b2140;                  /* tutorial hand outline */
  --confetti-light: #ffffff;             /* white pieces mixed into the confetti */
}

/* Liquid colour sets. Order: red, orange, yellow, green, teal, sky, blue,
   violet, pink, brown, lime, slate (liq-0 to liq-11). */
:root, [data-colours="classic"] {
  --liq-0: #e5484d; --liq-1: #f58a1f; --liq-2: #f6cf2f; --liq-3: #37b24d;
  --liq-4: #12a594; --liq-5: #49bdf2; --liq-6: #3a5bdc; --liq-7: #8e4ec6;
  --liq-8: #ee6fae; --liq-9: #9a6233; --liq-10: #a6d820; --liq-11: #7a879b;
}
[data-colours="pastel"] {
  --liq-0: #f29b9b; --liq-1: #f7be8c; --liq-2: #f6e294; --liq-3: #a3dcab;
  --liq-4: #92d8cd; --liq-5: #a6d6f5; --liq-6: #9fb0f0; --liq-7: #c6aaee;
  --liq-8: #f4b0d3; --liq-9: #c7a588; --liq-10: #d0ea94; --liq-11: #b2bccb;
}
[data-colours="neon"] {
  --liq-0: #ff2d55; --liq-1: #ff8a00; --liq-2: #fff01f; --liq-3: #2bff6a;
  --liq-4: #00f5d4; --liq-5: #19c8ff; --liq-6: #3d5afe; --liq-7: #b620ff;
  --liq-8: #ff3df2; --liq-9: #b0652a; --liq-10: #b6ff00; --liq-11: #8fa3bf;
}

/* =======================================================================
   S3  SHOP BACKDROPS
   Each block replaces the whole colour scheme. The id matches C4.
   ======================================================================= */
[data-backdrop="midnight"] {
  color-scheme: dark;
  --bg-base: #090b1c; --blob-1: #2a2e7a; --blob-2: #5a1d6c; --blob-3: #0e3a66;
  --text: #f1f3ff; --text-soft: #a4acd6;
  --accent: #98a3ff; --accent-glass: rgba(120, 132, 255, .60); --accent-ink: #ffffff; --accent-glow: rgba(152, 163, 255, .55);
  --glass-fill: rgba(255, 255, 255, .08); --glass-rim: rgba(255, 255, 255, .26); --glass-shadow: rgba(0, 0, 0, .45); --glass-highlight: rgba(255, 255, 255, .22);
  --card-fill: rgba(26, 29, 64, .84); --scrim: rgba(2, 3, 14, .62);
  --tube-fill: rgba(255, 255, 255, .06); --tube-outline: rgba(255, 255, 255, .55); --tube-shadow: rgba(0, 0, 0, .45); --tube-shine: rgba(255, 255, 255, .32);
  --shelf: rgba(255, 255, 255, .22); --focus: #ffffff; --ok: #55d99a;
}
[data-backdrop="forest"] {
  color-scheme: dark;
  --bg-base: #0d1c15; --blob-1: #1e5a3a; --blob-2: #5f611c; --blob-3: #0e4848;
  --text: #f0f7ef; --text-soft: #a9c4b0;
  --accent: #6fdc97; --accent-glass: rgba(70, 180, 115, .62); --accent-ink: #06200f; --accent-glow: rgba(111, 220, 151, .5);
  --glass-fill: rgba(255, 255, 255, .09); --glass-rim: rgba(255, 255, 255, .26); --glass-shadow: rgba(0, 0, 0, .42); --glass-highlight: rgba(255, 255, 255, .22);
  --card-fill: rgba(22, 48, 36, .86); --scrim: rgba(2, 12, 7, .60);
  --tube-fill: rgba(255, 255, 255, .07); --tube-outline: rgba(240, 255, 240, .55); --tube-shadow: rgba(0, 0, 0, .42); --tube-shine: rgba(255, 255, 255, .32);
  --shelf: rgba(240, 255, 240, .24); --focus: #ffffff; --ok: #6fdc97;
}
[data-backdrop="ocean"] {
  color-scheme: light;
  --bg-base: #e4f3fb; --blob-1: #8ad0f5; --blob-2: #a2efe2; --blob-3: #b6c4ff;
  --text: #0e2a44; --text-soft: #44627e;
  --accent: #0a7fc2; --accent-glass: rgba(10, 127, 194, .80); --accent-ink: #ffffff; --accent-glow: rgba(10, 127, 194, .45);
  --glass-fill: rgba(255, 255, 255, .44); --glass-rim: rgba(255, 255, 255, .9); --glass-shadow: rgba(14, 60, 100, .18); --glass-highlight: rgba(255, 255, 255, .95);
  --card-fill: rgba(255, 255, 255, .74); --scrim: rgba(10, 40, 66, .30);
  --tube-fill: rgba(255, 255, 255, .32); --tube-outline: rgba(14, 62, 104, .55); --tube-shadow: rgba(14, 60, 100, .2); --tube-shine: rgba(255, 255, 255, .7);
  --shelf: rgba(14, 62, 104, .30); --focus: #0e2a44; --ok: #12915a;
}
[data-backdrop="peach"] {
  color-scheme: light;
  --bg-base: #fff0e6; --blob-1: #ffbf9b; --blob-2: #ffdba6; --blob-3: #ffb0c6;
  --text: #46220f; --text-soft: #85573e;
  --accent: #e7603f; --accent-glass: rgba(231, 96, 63, .82); --accent-ink: #ffffff; --accent-glow: rgba(231, 96, 63, .45);
  --glass-fill: rgba(255, 255, 255, .44); --glass-rim: rgba(255, 255, 255, .9); --glass-shadow: rgba(120, 60, 30, .17); --glass-highlight: rgba(255, 255, 255, .95);
  --card-fill: rgba(255, 252, 248, .76); --scrim: rgba(70, 34, 15, .28);
  --tube-fill: rgba(255, 255, 255, .34); --tube-outline: rgba(120, 62, 34, .55); --tube-shadow: rgba(120, 60, 30, .2); --tube-shine: rgba(255, 255, 255, .7);
  --shelf: rgba(120, 62, 34, .30); --focus: #46220f; --ok: #1c9a5e;
}

/* =======================================================================
   S4  GLASS BUTTONS AND CARDS
   ======================================================================= */
:root {
  --glass-blur: 18px;        /* background blur behind glass */
  --glass-saturate: 170%;    /* extra colour behind glass */
  --radius-pill: 999px;      /* pills and round buttons */
  --radius-tile: 22px;       /* square-ish buttons */
  --radius-card: 28px;       /* pop-up and shop cards */
}
.frost {
  background: var(--glass-fill);
  -webkit-backdrop-filter: blur(var(--glass-blur)) saturate(var(--glass-saturate));
  backdrop-filter: blur(var(--glass-blur)) saturate(var(--glass-saturate));
  border: 1px solid var(--glass-rim);
  border-radius: var(--radius-pill);
  box-shadow: 0 10px 26px var(--glass-shadow), inset 0 1px 0 var(--glass-highlight);
  color: var(--text);
}
.frost.accent { background: var(--accent-glass); color: var(--accent-ink); }
.btn {
  font: inherit; font-weight: var(--fw-strong); cursor: pointer;
  -webkit-appearance: none; appearance: none; margin: 0;
  touch-action: manipulation;
  transition: transform var(--t-press-back) var(--spring), opacity .2s ease;
}
.btn:active:not(:disabled) { transform: scale(var(--press-scale)); transition-duration: var(--t-press); }
.btn:disabled { opacity: .42; cursor: default; }
.btn:focus-visible, .tube:focus-visible { outline: 3px solid var(--focus); outline-offset: 3px; }
.pill { display: inline-flex; align-items: center; gap: 7px; padding: 9px 14px; font-size: 14px; font-weight: var(--fw-strong); white-space: nowrap; }
.ico { width: 22px; height: 22px; flex: none; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.ico.solid { fill: currentColor; stroke-width: 1.5; }

/* =======================================================================
   S5  GAME LAYOUT
   ======================================================================= */
:root {
  --page-max-w: 440px;   /* widest the game column gets */
  --page-max-h: 880px;   /* tallest the game column gets */
  --page-pad: 16px;      /* smallest side padding */
}
*, *::before, *::after { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body {
  font-family: var(--font-body); font-size: 15px; color: var(--text);
  background: var(--bg-base); overflow: hidden; overscroll-behavior: none;
  display: flex; align-items: center; justify-content: center;
  -webkit-user-select: none; user-select: none;
  -webkit-tap-highlight-color: transparent; touch-action: manipulation;
}
/* Background wash: three large soft radial gradients over the base colour */
#bg {
  position: fixed; inset: 0; z-index: 0;
  background:
    radial-gradient(75% 55% at 8% 6%, var(--blob-1), transparent 72%),
    radial-gradient(70% 55% at 100% 38%, var(--blob-2), transparent 72%),
    radial-gradient(90% 60% at 35% 108%, var(--blob-3), transparent 72%),
    var(--bg-base);
}
#bg::after { content: ""; position: absolute; inset: 0; background: var(--bg-image, none) center / cover no-repeat; }
#app {
  position: relative; z-index: 1; width: 100%; max-width: var(--page-max-w);
  height: 100vh; height: 100dvh; max-height: var(--page-max-h);
}
#fx { position: fixed; inset: 0; z-index: 40; pointer-events: none; }
#confetti { position: fixed; inset: 0; z-index: 41; width: 100%; height: 100%; pointer-events: none; } /* confetti is drawn here, over everything */
.screen {
  position: absolute; inset: 0; display: flex; flex-direction: column;
  padding: max(var(--page-pad), env(safe-area-inset-top)) max(var(--page-pad), env(safe-area-inset-right))
           max(var(--page-pad), env(safe-area-inset-bottom)) max(var(--page-pad), env(safe-area-inset-left));
  opacity: 0; visibility: hidden; transform: scale(.955);
  transition: opacity var(--t-screen) ease, transform var(--t-screen) ease, visibility 0s linear var(--t-screen);
}
.screen.on { opacity: 1; visibility: visible; transform: none; transition-delay: 0s; }

.topbar { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 8px; flex: none; }
.topbar > :first-child { justify-self: start; }
.topbar > :last-child { justify-self: end; }
.icon-btn { width: 44px; height: 44px; padding: 0; display: grid; place-items: center; }
.levelnav { display: flex; align-items: center; gap: 4px; }
.nav-btn { width: 34px; height: 34px; padding: 0; display: grid; place-items: center; }
.nav-btn .ico { width: 18px; height: 18px; }
.level-name { margin: 0 6px; font: var(--fw-display) 24px/1 var(--font-display); letter-spacing: -.01em; white-space: nowrap; }

.board {
  flex: 1; min-height: 0; display: flex; flex-direction: column;
  align-items: center; justify-content: center; gap: var(--row-gap, 16px);
}
.row { position: relative; display: flex; gap: var(--gap, 16px); padding: var(--lift, 20px) 0 var(--shelf-space, 12px); }
.row::after { /* the thin shelf the tubes stand on */
  content: ""; position: absolute; left: -10px; right: -10px; bottom: 2px; height: 4px;
  border-radius: 99px; background: var(--shelf);
}
.slot { position: relative; width: var(--tw); height: var(--th); flex: none; }

.status {
  flex: none; height: 44px; margin: 4px 0 0; display: flex; align-items: center; justify-content: center;
  text-align: center; font-weight: var(--fw-strong); line-height: 1.25;
}
.check { flex: none; align-self: center; display: flex; align-items: center; gap: 9px; padding: 6px 4px; font-size: 14px; color: var(--text-soft); cursor: pointer; }
.check input { position: absolute; opacity: 0; width: 1px; height: 1px; }
.check .box { width: 24px; height: 24px; border-radius: 8px; display: grid; place-items: center; box-shadow: inset 0 1px 0 var(--glass-highlight); }
.check .box .ico { width: 16px; height: 16px; stroke-width: 3; opacity: 0; transform: scale(.4); transition: opacity .15s, transform .25s var(--spring); }
.check input:checked + .box { background: var(--accent-glass); color: var(--accent-ink); }
.check input:checked + .box .ico { opacity: 1; transform: none; }
.check input:focus-visible + .box { outline: 3px solid var(--focus); outline-offset: 3px; }

.actions { flex: none; display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; margin-top: 8px; }
.action { border-radius: var(--radius-tile); padding: 10px 2px 9px; display: flex; flex-direction: column; align-items: center; gap: 4px; font-size: 12.5px; white-space: nowrap; }

.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }

@media (max-width: 350px) {
  .level-name { font-size: 20px; margin: 0 3px; }
  .icon-btn { width: 40px; height: 40px; }
  .nav-btn { width: 30px; height: 30px; }
  .pill { padding: 8px 10px; font-size: 13px; }
}

/* =======================================================================
   S6  TUBES AND LIQUID
   Sizes (--tw tube width, --th tube height, --bh band height) are worked
   out by the script from the space available (numbers in C8).
   ======================================================================= */
.tube {
  position: relative; display: block; width: var(--tw); height: var(--th);
  padding: 0; margin: 0; border: 0; background: none; cursor: pointer;
  -webkit-appearance: none; appearance: none; border-radius: 8px;
  transform-origin: 50% 0; touch-action: manipulation;
  transition: translate var(--t-lift) var(--spring);
}
.tube.sel { translate: 0 calc(var(--lift) * -1); }
.tube.pouring { z-index: 30; }
.tube[aria-disabled="true"] { cursor: default; }
.glass {
  position: absolute; inset: 0; overflow: hidden;
  border: var(--line, 2px) solid var(--tube-outline);
  border-top-width: var(--line-top, 0px);
  border-radius: var(--shape);
  background: var(--tube-fill);
  box-shadow: 0 7px 14px var(--tube-shadow), var(--glass-extra, 0 0 0 transparent);
}
.tube::before { /* the lip around the mouth */
  content: ""; position: absolute; z-index: 2; top: var(--lip-top, -2px);
  left: var(--lip-inset, -3px); right: var(--lip-inset, -3px); height: var(--lip-h, 4px);
  border-radius: 99px; background: var(--lip-colour, var(--tube-outline));
}
.liquid { position: absolute; left: 0; right: 0; bottom: 0; display: flex; flex-direction: column-reverse; }
.band {
  position: relative; flex: none; height: var(--bh); overflow: hidden;
  background: linear-gradient(90deg, var(--gloss-light), transparent 38%, var(--gloss-dark)), var(--c);
  transition: height 0s linear;
}
.band:last-child::after { /* light surface line on the top band */
  content: ""; position: absolute; left: 0; right: 0; top: 0; height: 2px; background: var(--surface-line);
}
.shine {
  position: absolute; z-index: 3; top: 9%; bottom: 16%; left: 15%; width: 15%;
  border-radius: 99px; background: linear-gradient(to bottom, var(--tube-shine), transparent 88%); pointer-events: none;
}
.sym { /* colour-blind symbol, shown when "Show symbols" is ticked */
  display: none; position: absolute; left: 50%; top: 50%;
  width: calc(var(--bh) * .62); height: calc(var(--bh) * .62); translate: -50% -50%;
  fill: var(--sym-fill); stroke: var(--sym-line); stroke-width: 1.8; paint-order: stroke; stroke-linejoin: round;
}
.symbols .sym { display: block; }
.cork {
  position: absolute; z-index: 4; pointer-events: none;
  width: var(--cork-w, 62%); left: calc(50% - var(--cork-w, 62%) / 2);
  top: calc(var(--tw) * -.2); height: calc(var(--tw) * .42);
  border-radius: 4px 4px 6px 6px;
  background: linear-gradient(90deg, var(--cork-light), var(--cork) 45%, var(--cork-deep));
  box-shadow: 0 2px 4px var(--tube-shadow);
  opacity: 0; translate: 0 -170%;
  transition: translate var(--t-cork) var(--spring) .08s, opacity .12s linear .08s;
}
.tube.done .cork { opacity: 1; translate: 0 0; }
.tube.pop .glass { animation: pop var(--t-pop) var(--spring); }
.tube.hint-from { animation: hint-bob .55s ease-in-out infinite alternate; }
.tube.hint-to .glass { outline: 3px dashed var(--accent); outline-offset: 4px; }

/* --- Tube shapes. One block per shop tube; the id matches C4. --- */
[data-tube="test"] {                       /* plain round-bottomed test tube */
  --shape: 3px 3px calc(var(--tw) / 2) calc(var(--tw) / 2);
}
[data-tube="vial"] {                       /* shouldered vial with a narrow neck */
  --shape: calc(var(--tw) * .3) calc(var(--tw) * .3) calc(var(--tw) * .16) calc(var(--tw) * .16);
  --line-top: var(--line, 2px);
  --lip-inset: 18%; --lip-h: 8px; --lip-top: -7px; --cork-w: 48%;
}
[data-tube="beaker"] {                     /* flat-bottomed beaker with a wide lip and marks */
  --shape: 2px 2px 6px 6px;
  --lip-inset: -5px; --lip-h: 4px;
}
[data-tube="beaker"] .glass::after {
  content: ""; position: absolute; z-index: 2; right: 10%; width: 26%; top: 14%; bottom: 5%;
  background: repeating-linear-gradient(to bottom, var(--tube-outline) 0 1.5px, transparent 1.5px calc(var(--bh) / 2));
}
[data-tube="bulb"] {                       /* domed top and deep round bottom */
  --shape: 42% 42% 50% 50% / 12% 12% 34% 34%;
  --line-top: var(--line, 2px);
  --lip-inset: 24%; --lip-h: 7px; --lip-top: -6px; --cork-w: 42%;
}
[data-tube="glow"] {                       /* test tube with a glowing accent outline */
  --shape: 3px 3px calc(var(--tw) / 2) calc(var(--tw) / 2);
  --tube-outline: var(--accent);
  --glass-extra: 0 0 16px var(--accent-glow), inset 0 0 12px var(--accent-glow);
}
[data-tube="gilded"] {                     /* gold outline, gold lip and collar */
  --shape: 3px 3px calc(var(--tw) / 2) calc(var(--tw) / 2);
  --tube-outline: var(--gold); --line: 2.5px;
  --lip-colour: linear-gradient(90deg, var(--gold-light), var(--gold) 50%, var(--gold-deep));
  --lip-h: 6px; --lip-top: -3px; --lip-inset: -4px;
}
[data-tube="gilded"] .glass::before {
  content: ""; position: absolute; z-index: 2; left: 0; right: 0; top: calc(var(--tw) * .2); height: 3px;
  background: linear-gradient(90deg, var(--gold-light), var(--gold) 50%, var(--gold-deep));
}

/* Pour stream and tutorial hand */
.stream {
  position: fixed; border-radius: 99px; transform: scaleY(0); transform-origin: 50% 0;
  background: linear-gradient(90deg, var(--gloss-light), transparent 40%, var(--gloss-dark)), var(--c);
  transition: transform linear;
}
.hand {
  position: absolute; z-index: 5; left: 50%; top: calc(100% + 14px); width: 46px; margin-left: -20px;
  pointer-events: none; animation: bob .6s ease-in-out infinite alternate;
  filter: drop-shadow(0 4px 6px var(--tube-shadow));
}
.hand svg, .hand img { display: block; width: 100%; height: auto; }
.hand path { fill: var(--hand-fill); stroke: var(--hand-line); stroke-width: 2.5; stroke-linejoin: round; }

/* =======================================================================
   S7  HOME, SHOP AND POP-UPS
   ======================================================================= */
/* --- Home --- */
#home { align-items: center; justify-content: space-between; text-align: center; padding-top: max(28px, env(safe-area-inset-top)); }
.title { margin: 0; font: var(--fw-display) clamp(56px, 19vw, 86px)/.95 var(--font-display); letter-spacing: -.035em; }
.title img { max-width: 78%; height: auto; }
.tagline { margin: 8px 0 0; font-size: 16px; font-weight: 500; letter-spacing: .02em; color: var(--text-soft); }
.droplet {
  width: min(108px, 15vh); height: min(108px, 15vh); margin: 22px 0 10px;
  border-radius: 0 50% 50% 50%; transform: rotate(45deg); display: grid; place-items: center; flex: none;
}
.droplet-in { transform: rotate(-45deg); display: flex; flex-direction: column; align-items: center; line-height: 1; margin-top: 8px; }
.droplet-in small { font-size: 11px; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; color: var(--text-soft); }
.droplet-in b { font: var(--fw-display) 38px/1 var(--font-display); }
.droplet.img { background: var(--badge-image) center / contain no-repeat; border: 0; box-shadow: none; -webkit-backdrop-filter: none; backdrop-filter: none; border-radius: 0; transform: none; }
.droplet.img .droplet-in { transform: none; }
.play { display: inline-flex; align-items: center; justify-content: center; gap: 10px; min-width: 210px; padding: 18px 34px; font: var(--fw-display) 26px/1 var(--font-display); }
.play .ico { width: 28px; height: 28px; }
.coin {
  width: 18px; height: 18px; border-radius: 50%; flex: none;
  background: var(--coin-image, radial-gradient(circle at 35% 30%, var(--gold-light), var(--gold) 55%, var(--gold-deep)));
  background-size: cover; box-shadow: inset 0 0 0 2px var(--gold-deep);
}
.coin-img .coin { box-shadow: none; border-radius: 0; background-size: contain; background-repeat: no-repeat; background-position: center; }
.home-row { align-self: stretch; display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; }
.tile { border-radius: var(--radius-tile); padding: 11px 0 9px; display: flex; flex-direction: column; align-items: center; gap: 5px; font-size: 11.5px; white-space: nowrap; }
.tile .off-only, .tile.off .on-only { display: none; }
.tile.off .off-only { display: block; }
.tile.off .ico { opacity: .55; }

/* --- Shop --- */
.tabs { flex: none; display: grid; grid-template-columns: repeat(3, 1fr); gap: 4px; padding: 4px; margin-top: 14px; }
.tab { border: 1px solid transparent; background: none; color: var(--text); border-radius: var(--radius-pill); padding: 10px 4px; font-size: 14px; }
.tab.accent { border-color: var(--glass-rim); box-shadow: inset 0 1px 0 var(--glass-highlight); }
.shop-grid { flex: 1; min-height: 0; overflow-y: auto; display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; align-content: start; padding: 14px 2px 8px; margin: 0 -2px; }
.card-btn { border-radius: var(--radius-card); padding: 12px 10px 13px; display: flex; flex-direction: column; align-items: center; gap: 3px; text-align: center; }
.card-btn.in-use { border-color: var(--accent); box-shadow: 0 10px 26px var(--glass-shadow), inset 0 1px 0 var(--glass-highlight), 0 0 0 2px var(--accent); }
.card-btn.locked .preview { opacity: .5; }
.card-name { font: var(--fw-display) 17px/1.2 var(--font-display); }
.card-state { font-size: 13px; font-weight: 500; color: var(--text-soft); }
.preview { --tw: 30px; --bh: 15px; --th: 76px; --lift: 0px; height: 96px; width: 100%; display: grid; place-items: center; padding-top: 10px; }
.preview.swatch {
  height: 84px; margin-bottom: 12px; padding: 0; border-radius: 18px; border: 1px solid var(--glass-rim);
  background:
    radial-gradient(75% 60% at 8% 6%, var(--blob-1), transparent 72%),
    radial-gradient(70% 60% at 100% 38%, var(--blob-2), transparent 72%),
    radial-gradient(90% 65% at 35% 108%, var(--blob-3), transparent 72%),
    var(--bg-base);
  background-size: cover; background-position: center;
}
.preview.dots { height: 84px; margin-bottom: 12px; padding: 0 8px; grid-template-columns: repeat(6, 1fr); gap: 6px; align-content: center; }
.preview.dots i { width: 100%; max-width: 22px; aspect-ratio: 1; border-radius: 50%; background: linear-gradient(135deg, var(--gloss-light), transparent 55%), var(--c); box-shadow: 0 2px 4px var(--glass-shadow); }
.preview .tube { cursor: inherit; }
.preview .tube.done .cork { transition: none; }

/* --- Pop-ups --- */
.pop { position: absolute; inset: 0; z-index: 50; display: grid; place-items: center; padding: 24px; visibility: hidden; opacity: 0; transition: opacity .2s ease, visibility 0s linear .2s; }
.pop.on { visibility: visible; opacity: 1; transition-delay: 0s; }
.scrim { position: fixed; inset: 0; background: var(--scrim); }
.card { position: relative; width: 100%; max-width: 340px; padding: 26px 22px 22px; text-align: center; border-radius: var(--radius-card); background: var(--card-fill); transform: translateY(40px) scale(.93); transition: transform var(--t-popup) var(--spring); }
.pop.on .card { transform: none; }
.card h2 { margin: 0 0 8px; font: var(--fw-display) 28px/1.1 var(--font-display); letter-spacing: -.02em; }
.card p { margin: 0 0 6px; font-size: 16px; }
.card .note { min-height: 1.3em; font-size: 14px; font-weight: var(--fw-strong); color: var(--ok); }
.card-row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 16px; }
.card-row .btn, .card > .btn { padding: 14px 10px; font-size: 16px; }
.card > .btn { width: 100%; margin-top: 16px; }
.award-list { list-style: none; margin: 14px 0 0; padding: 0; text-align: left; display: grid; gap: 8px; }
.award-list li { display: grid; grid-template-columns: 30px 1fr; align-items: center; gap: 10px; padding: 9px 12px; border-radius: 16px; background: var(--glass-fill); border: 1px solid var(--glass-rim); }
.award-list .tick { width: 28px; height: 28px; border-radius: 50%; display: grid; place-items: center; border: 2px solid var(--tube-outline); color: transparent; }
.award-list .tick .ico { width: 16px; height: 16px; stroke-width: 3; }
.award-list li.earned .tick { background: var(--ok); border-color: var(--ok); color: #fff; }
.award-list li:not(.earned) { opacity: .62; }
.award-list b { display: block; font: var(--fw-display) 16px/1.2 var(--font-display); }
.award-list small { font-size: 13px; color: var(--text-soft); }

/* --- Very short screens (a phone held sideways): shrink things so nothing is cut off.
       Kept at the end of S7 so it wins over the rules above. --- */
@media (max-height: 520px) {
  #home { padding-top: max(10px, env(safe-area-inset-top)); }
  .title { font-size: 40px; }
  .tagline { margin-top: 2px; font-size: 13px; }
  .droplet { width: 52px; height: 52px; margin: 10px 0 4px; }
  .droplet-in { margin-top: 4px; }
  .droplet-in small { display: none; }
  .droplet-in b { font-size: 22px; }
  .play { padding: 10px 28px; font-size: 20px; }
  .play .ico { width: 20px; height: 20px; }
  .tile { padding: 6px 0 5px; gap: 2px; }
  .icon-btn { width: 36px; height: 36px; }
  .status { height: 26px; margin: 0; font-size: 13px; }
  .check { padding: 2px 4px; font-size: 13px; }
  .action { flex-direction: row; justify-content: center; gap: 6px; padding: 8px 4px; }
  .action .ico { width: 18px; height: 18px; }
}

/* =======================================================================
   S8  ANIMATIONS
   CSS timings live here. The pour sequence timings are in CONFIG (C7).
   ======================================================================= */
:root {
  --spring: cubic-bezier(.34, 1.56, .64, 1);  /* springy overshoot ease */
  --t-lift: .3s;        /* selected tube lifts / drops */
  --t-pop: .4s;         /* finished tube pop */
  --t-cork: .34s;       /* cork drops in */
  --t-screen: .26s;     /* home / shop / game fade and scale */
  --t-popup: .45s;      /* pop-up rises in */
  --t-press: .07s;      /* button shrinks when pressed */
  --t-press-back: .32s; /* button springs back */
  --press-scale: .93;   /* pressed button size */
}
@keyframes pop { 0% { scale: 1; } 45% { scale: 1.07; } 100% { scale: 1; } }
@keyframes bob { from { translate: 0 0; } to { translate: 0 -9px; } }
@keyframes hint-bob { from { translate: 0 0; } to { translate: 0 calc(var(--lift) * -.7); } }
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; }
}
</style>
</head>
<body>

<div id="bg" aria-hidden="true"></div>

<main id="app">

  <!-- ===================================================================
       P1  GAME SCREEN
       Labels are filled in from CONFIG (C1): data-t = text, data-tl = spoken label.
       =================================================================== -->
  <section id="game" class="screen" aria-label="Game">
    <header class="topbar">
      <button id="btnHome" class="frost btn icon-btn" type="button" data-tl="home">
        <svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 11.5 12 4l8 7.5M6.5 10v9.5h11V10"/></svg>
      </button>
      <div class="levelnav">
        <button id="btnPrev" class="frost btn nav-btn" type="button" data-tl="prevLevel">
          <svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M14.5 5 8 12l6.5 7"/></svg>
        </button>
        <h1 id="levelName" class="level-name"></h1>
        <button id="btnNext" class="frost btn nav-btn" type="button" data-tl="nextLevelArrow">
          <svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M9.5 5 16 12l-6.5 7"/></svg>
        </button>
      </div>
      <div id="pours" class="frost pill"></div>
    </header>

    <div id="board" class="board" role="group" data-tl="boardLabel" data-tube="test"></div>

    <p id="status" class="status" role="status" aria-live="polite"></p>
    <p id="sr" class="sr-only" role="status" aria-live="polite"></p>

    <label class="check">
      <input type="checkbox" id="chkSymbols">
      <span class="box frost"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="m5 12.5 4.5 4.5L19 7.5"/></svg></span>
      <span data-t="symbols"></span>
    </label>

    <nav class="actions" data-tl="actionsLabel">
      <button id="btnUndo" class="frost btn action" type="button">
        <svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 6 4.5 10.5 9 15M5 10.5h9.5a5 5 0 0 1 0 10H11"/></svg>
        <span data-t="undo"></span>
      </button>
      <button id="btnHint" class="frost btn action" type="button">
        <svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 18h6M10 21h4M12 3a6 6 0 0 0-3.5 10.9c.6.5 1 1.2 1 2.1h5c0-.9.4-1.6 1-2.1A6 6 0 0 0 12 3z"/></svg>
        <span data-t="hint"></span>
      </button>
      <button id="btnAdd" class="frost btn action" type="button">
        <svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 3h8M6.5 3v14a2.5 2.5 0 0 0 5 0V3M18 11v8M14 15h8"/></svg>
        <span data-t="addTube"></span>
      </button>
      <button id="btnRestart" class="frost btn action" type="button">
        <svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12a7 7 0 1 0 2.1-5M7.1 3v4h4"/></svg>
        <span data-t="restart"></span>
      </button>
    </nav>
  </section>

  <!-- ===================================================================
       P2  HOME SCREEN
       =================================================================== -->
  <section id="home" class="screen" aria-label="Home">
    <div>
      <h1 id="homeTitle" class="title" data-t="title"></h1>
      <p class="tagline" data-t="tagline"></p>
    </div>

    <div id="homeBadge" class="droplet frost">
      <span class="droplet-in"><small data-t="levelWord"></small><b id="homeLevel"></b></span>
    </div>

    <button id="btnPlay" class="frost accent btn play" type="button">
      <svg class="ico solid" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5.5v13l11-6.5z"/></svg>
      <span data-t="play"></span>
    </button>

    <div id="homeCoinPill" class="frost pill"><span class="coin" aria-hidden="true"></span><span id="homeCoins" aria-hidden="true"></span></div>

    <div class="home-row">
      <button id="btnSound" class="frost btn tile" type="button">
        <svg class="ico on-only" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9.5v5h3.5l4.5 4v-13l-4.5 4zM15.5 9a4 4 0 0 1 0 6M18 6.5a7.5 7.5 0 0 1 0 11"/></svg>
        <svg class="ico off-only" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9.5v5h3.5l4.5 4v-13l-4.5 4zM16 9.5l5 5M21 9.5l-5 5"/></svg>
        <span id="lblSound"></span>
      </button>
      <button id="btnBuzz" class="frost btn tile" type="button">
        <svg class="ico on-only" viewBox="0 0 24 24" aria-hidden="true"><rect x="8" y="4" width="8" height="16" rx="2"/><path d="M4.5 9v6M19.5 9v6M1.5 10.5v3M22.5 10.5v3"/></svg>
        <svg class="ico off-only" viewBox="0 0 24 24" aria-hidden="true"><rect x="8" y="4" width="8" height="16" rx="2"/><path d="M4 4l16 16"/></svg>
        <span id="lblBuzz"></span>
      </button>
      <button id="btnTubes" class="frost btn tile" type="button">
        <svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 3h8M9.5 3v14.5a2.5 2.5 0 0 0 5 0V3M9.5 11h5"/></svg>
        <span data-t="tubes"></span>
      </button>
      <button id="btnThemes" class="frost btn tile" type="button">
        <svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="5" width="16" height="14" rx="3"/><path d="m4.5 16.5 4.5-4.5 3.5 3.5 2.5-2.5 4.5 4.5"/><circle cx="15.5" cy="9.5" r="1.2"/></svg>
        <span data-t="themes"></span>
      </button>
      <button id="btnAwards" class="frost btn tile" type="button">
        <svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="9" r="5"/><path d="M9 13.5 7.5 21l4.5-2.5 4.5 2.5-1.500-7.500"/></svg>
        <span data-t="awards"></span>
      </button>
    </div>
  </section>

  <!-- ===================================================================
       P3  SHOP SCREEN
       =================================================================== -->
  <section id="shop" class="screen" aria-label="Shop">
    <header class="topbar">
      <button id="btnBack" class="frost btn icon-btn" type="button" data-tl="back">
        <svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M14.5 5 8 12l6.5 7"/></svg>
      </button>
      <h1 class="level-name" data-t="shop"></h1>
      <div id="shopCoinPill" class="frost pill"><span class="coin" aria-hidden="true"></span><span id="shopCoins" aria-hidden="true"></span></div>
    </header>
    <div class="tabs frost" role="tablist">
      <button class="btn tab" type="button" role="tab" data-tab="tubes" data-t="tabTubes"></button>
      <button class="btn tab" type="button" role="tab" data-tab="backdrops" data-t="tabBackdrops"></button>
      <button class="btn tab" type="button" role="tab" data-tab="colours" data-t="tabColours"></button>
    </div>
    <div id="shopGrid" class="shop-grid" role="tabpanel"></div>
    <p id="shopMsg" class="status" role="status" aria-live="polite"></p>
  </section>

  <!-- ===================================================================
       P4  POP-UPS
       =================================================================== -->
  <div id="win" class="pop" role="dialog" aria-modal="true" aria-labelledby="winTitle">
    <div class="scrim"></div>
    <div class="card frost">
      <h2 id="winTitle"></h2>
      <p id="winBody"></p>
      <p id="winAward" class="note"></p>
      <div class="card-row">
        <button id="winHome" class="frost btn" type="button" data-t="winHome"></button>
        <button id="winNext" class="frost accent btn" type="button" data-t="winNext"></button>
      </div>
    </div>
  </div>

  <div id="awards" class="pop" role="dialog" aria-modal="true" aria-labelledby="awardsTitle">
    <div class="scrim" id="awardsScrim"></div>
    <div class="card frost">
      <h2 id="awardsTitle" data-t="awardsTitle"></h2>
      <ul id="awardList" class="award-list"></ul>
      <button id="awardsClose" class="frost accent btn" type="button" data-t="close"></button>
    </div>
  </div>
</main>

<div id="fx" aria-hidden="true"></div>
<canvas id="confetti" aria-hidden="true"></canvas>

<!-- Colour-blind symbols, one per colour (sym-0 red ... sym-11 slate) -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false">
  <symbol id="sym-0" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8"/></symbol>
  <symbol id="sym-1" viewBox="0 0 24 24"><rect x="5" y="5" width="14" height="14" rx="1"/></symbol>
  <symbol id="sym-2" viewBox="0 0 24 24"><path d="M12 4 21 20H3z"/></symbol>
  <symbol id="sym-3" viewBox="0 0 24 24"><path d="M12 3l9 9-9 9-9-9z"/></symbol>
  <symbol id="sym-4" viewBox="0 0 24 24"><path d="M12 2.500 14.350 8.760 21.030 9.060 15.800 13.240 17.580 19.690 12 16 6.420 19.690 8.200 13.240 2.970 9.060 9.650 8.760z"/></symbol>
  <symbol id="sym-5" viewBox="0 0 24 24"><path d="M9.500 3h5v6.500H21v5h-6.500V21h-5v-6.500H3v-5h6.500z"/></symbol>
  <symbol id="sym-6" viewBox="0 0 24 24"><path fill-rule="evenodd" d="M12 3a9 9 0 1 0 0 18a9 9 0 0 0 0-18zm0 5a4 4 0 1 1 0 8a4 4 0 0 1 0-8z"/></symbol>
  <symbol id="sym-7" viewBox="0 0 24 24"><path d="M21 12 16.500 19.790H7.500L3 12l4.500-7.790h9z"/></symbol>
  <symbol id="sym-8" viewBox="0 0 24 24"><path d="M12 20.500C5 15.500 3 12 3 8.800A4.800 4.800 0 0 1 12 6.500a4.800 4.800 0 0 1 9 2.300c0 3.200-2 6.700-9 11.700z"/></symbol>
  <symbol id="sym-9" viewBox="0 0 24 24"><path d="M4 6h16v4.500H4zM4 13.500h16V18H4z"/></symbol>
  <symbol id="sym-10" viewBox="0 0 24 24"><path d="M19 14.500A8 8 0 1 1 9.500 5a7 7 0 0 0 9.500 9.500z"/></symbol>
  <symbol id="sym-11" viewBox="0 0 24 24"><path transform="rotate(45 12 12)" d="M9.500 2h5v7.500H22v5h-7.500V22h-5v-7.500H2v-5h7.500z"/></symbol>
</svg>

<!-- =====================================================================
     SETTINGS: everything you are likely to change is in CONFIG
     ===================================================================== -->
<script>
const CONFIG = {

    tutorialSecond: 'Now tap the other tube to pour.',

    hintNone: 'No solution from here. Undo a few pours.',

    undone: 'Pour undone.',
    tubeAdded: 'Extra tube added.',

    levelDone: 'Level cleared. Restart to play it again.',   // shown on a level you have already cleared
    tubeIsDone: 'That tube is finished.',
    tubeIsEmpty: 'That tube is empty.',
    winTitle: 'Level {n} cleared',
    winBody: 'Sorted in {pours}. +{coins} coins.',   // first time a level is cleared
    winBodyReplay: 'Sorted in {pours}.',             // replaying an old level
    winHome: 'Home',
