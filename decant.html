<!-- =====================================================================
     ENGINE: puzzle rules, level generator and solver. No screen code.
     Tubes are arrays of colour numbers, bottom first, top last.
     ===================================================================== -->
<script>
const Engine = (function () {
  'use strict';

  /* Seeded random numbers: the same seed always gives the same sequence. */
  function makeRandom(seed) {
    let a = seed >>> 0;
    return function () {
      a = (a + 0x6D2B79F5) >>> 0;
      let t = a;
      t = Math.imul(t ^ (t >>> 15), t | 1);
      t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }
  function shuffle(list, random) {
    for (let i = list.length - 1; i > 0; i--) {
      const j = Math.floor(random() * (i + 1));
      const tmp = list[i]; list[i] = list[j]; list[j] = tmp;
    }
    return list;
  }

  /* ----- Rules (work on arrays and on the solver's strings alike) ----- */

  /* How many matching bands sit on top of a tube. */
  function topRun(tube) {
    const len = tube.length;
    if (!len) return 0;
    const top = tube[len - 1];
    let n = 1;
    while (n < len && tube[len - 1 - n] === top) n++;
    return n;
  }
  function isFinished(tube, cap) { return tube.length === cap && topRun(tube) === cap; }
  function isCleared(board, cap) {
    for (let i = 0; i < board.length; i++) {
      if (board[i].length && !isFinished(board[i], cap)) return false;
    }
    return true;
  }
  function canPour(board, from, to, cap) {
    if (from === to) return false;
    const s = board[from], d = board[to];
    if (!s || !d || !s.length || isFinished(s, cap)) return false;
    if (d.length >= cap) return false;
    return !d.length || d[d.length - 1] === s[s.length - 1];
  }
  /* Pour in place; returns how many bands moved. */
  function pour(board, from, to, cap) {
    if (!canPour(board, from, to, cap)) return 0;
    const s = board[from], d = board[to];
    const n = Math.min(topRun(s), cap - d.length);
    for (let i = 0; i < n; i++) d.push(s.pop());
    return n;
  }
  function unpour(board, from, to, n) {
    for (let i = 0; i < n; i++) board[from].push(board[to].pop());
  }

  /* Every pour worth trying, best first. Leaves out pours that change nothing
     (a single-colour tube into an empty tube, or a second empty tube). */
  function listMoves(board, cap) {
    const out = [];
    const count = board.length;
    let firstEmpty = -1;
    for (let i = 0; i < count; i++) if (!board[i].length) { firstEmpty = i; break; }
    for (let a = 0; a < count; a++) {
      const s = board[a];
      if (!s.length) continue;
      const run = topRun(s);
      if (run === cap) continue;                       // finished
      const uniform = run === s.length;
      const top = s[s.length - 1];
      for (let b = 0; b < count; b++) {
        if (a === b) continue;
        const d = board[b];
        if (!d.length) {
          if (b === firstEmpty && !uniform) out.push([a, b, 1]);
          continue;
        }
        if (d.length >= cap || d[d.length - 1] !== top) continue;
        const room = cap - d.length;
        let score = 0;                                 // partial pours last
        if (run <= room) {
          score = 10 + d.length + run;
          if (uniform) score += 5;                     // empties a tube
          if (d.length + run === cap && topRun(d) === d.length) score += 20; // finishes a tube
        }
        out.push([a, b, score]);
      }
    }
    out.sort(function (x, y) { return y[2] - x[2]; });
    return out;
  }
  function hasMoves(board, cap) { return listMoves(board, cap).length > 0; }

  /* ----- Solver: depth-first search with a visited set and a node limit ----- */
  function keyOf(state) { return state.slice().sort().join('|'); }
  function pourString(state, from, to, cap) {
    const s = state[from], d = state[to];
    const n = Math.min(topRun(s), cap - d.length);
    const next = state.slice();
    next[from] = s.slice(0, s.length - n);
    next[to] = d + s.slice(s.length - n);
    return next;
  }
  /* Returns { solved, moves: [[from, to], ...], nodes, exhausted }.
     exhausted = true means every position was checked and none works. */
  function solve(board, cap, nodeLimit) {
    const start = board.map(function (t) {
      return t.map(function (c) { return String.fromCharCode(65 + c); }).join('');
    });
    if (isCleared(start, cap)) return { solved: true, moves: [], nodes: 0, exhausted: false };
    const seen = new Set([keyOf(start)]);
    const stack = [{ state: start, moves: listMoves(start, cap), next: 0 }];
    const path = [];
    let nodes = 1;
    while (stack.length) {
      const frame = stack[stack.length - 1];
      if (frame.next >= frame.moves.length) { stack.pop(); path.pop(); continue; }
      const m = frame.moves[frame.next++];
      const state = pourString(frame.state, m[0], m[1], cap);
      const key = keyOf(state);
      if (seen.has(key)) continue;
      seen.add(key);
      path.push([m[0], m[1]]);
      if (isCleared(state, cap)) return { solved: true, moves: path, nodes: nodes, exhausted: false };
      if (++nodes > nodeLimit) return { solved: false, moves: [], nodes: nodes, exhausted: false };
      stack.push({ state: state, moves: listMoves(state, cap), next: 0 });
    }
    return { solved: false, moves: [], nodes: nodes, exhausted: true };
  }

  /* ----- Levels ----- */

  /* What a level number is made of, read from the levels settings. */
  function levelSpec(n, L) {
    if (n === L.tutorialLevel) return { tutorial: L.tutorial };
    if (L.fixedLevels && L.fixedLevels[n]) return L.fixedLevels[n];
    const i = Math.max(0, n - L.listStart);
    const list = L.coloursPerLevel;
    return { colours: i < list.length ? list[i] : L.coloursAfter, empty: L.emptyTubes };
  }
  function isTutorial(n, L) { return n === L.tutorialLevel; }

  /* Build the puzzle for a level number. The same number always gives the same
     puzzle: seeds are tried in order until one is solvable. */
  function makeLevel(n, L, paletteSize) {
    const spec = levelSpec(n, L);
    if (spec.tutorial) return spec.tutorial.map(function (t) { return t.slice(); });
    const cap = L.capacity;
    const colours = Math.min(spec.colours, paletteSize);
    let board = null;
    for (let attempt = 0; attempt < L.maxAttempts; attempt++) {
      const random = makeRandom(L.seed + n * 1000003 + attempt * 7919);
      const palette = [];
      for (let c = 0; c < paletteSize; c++) palette.push(c);
      shuffle(palette, random);
      const bands = [];
      for (let c = 0; c < colours; c++) for (let k = 0; k < cap; k++) bands.push(palette[c]);
      shuffle(bands, random);
      board = [];
      for (let t = 0; t < colours; t++) board.push(bands.slice(t * cap, (t + 1) * cap));
      for (let e = 0; e < spec.empty; e++) board.push([]);
      if (board.some(function (t) { return topRun(t) >= L.rejectTopRun; })) continue;
      if (solve(board, cap, L.solverNodes).solved) return board;
    }
    return board;   // only reached if every seed failed
  }

  /* The finished position of a board (every colour sorted into its own tube),
     used to show a level that has already been cleared. */
  function finishedBoard(board, cap, nodeLimit) {
    const out = board.map(function (t) { return t.slice(); });
    const result = solve(out, cap, nodeLimit);
    if (result.solved) {
      result.moves.forEach(function (m) { pour(out, m[0], m[1], cap); });
      return out;
    }
    const colours = [];                                  // fallback: one colour per tube, in order
    board.forEach(function (t) { t.forEach(function (c) { if (colours.indexOf(c) < 0) colours.push(c); }); });
    return board.map(function (t, i) {
      const tube = [];
      if (i < colours.length) for (let k = 0; k < cap; k++) tube.push(colours[i]);
      return tube;
    });
  }

  return {
    finishedBoard: finishedBoard,
    topRun: topRun, isFinished: isFinished, isCleared: isCleared,
    canPour: canPour, pour: pour, unpour: unpour,
    listMoves: listMoves, hasMoves: hasMoves, solve: solve,
    levelSpec: levelSpec, isTutorial: isTutorial, makeLevel: makeLevel
  };
})();
</script>

<!-- =====================================================================
     SCREENS: drawing, touch, sound, saving, shop and awards
     ===================================================================== -->
<script>
(function () {
  'use strict';

  const T = CONFIG.text, L = CONFIG.levels, SHOP = CONFIG.shop, A = CONFIG.anim;
  const G = CONFIG.layout, SND = CONFIG.sound, IMG = CONFIG.images;
  const CAP = L.capacity;

  const $ = function (id) { return document.getElementById(id); };
  const root = document.documentElement;
  const appEl = $('app'), boardEl = $('board'), fxEl = $('fx');
  const statusEl = $('status'), srEl = $('sr');
  const screens = { game: $('game'), home: $('home'), shop: $('shop') };
  const winEl = $('win'), awardsEl = $('awards');
  const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)');

  /* ---------- small helpers ---------- */
  function fmt(text, vars) {
    return String(text).replace(/\{(\w+)\}/g, function (m, k) { return vars && k in vars ? vars[k] : m; });
  }
  function el(tag, cls, text) {
    const e = document.createElement(tag);
    if (cls) e.className = cls;
    if (text != null) e.textContent = text;
    return e;
  }
  function sleep(ms) { return new Promise(function (done) { setTimeout(done, ms); }); }
  function poursText(n) { return fmt(n === 1 ? T.pourOne : T.pourMany, { n: n }); }
  function motionOff() { return reduceMotion.matches; }
  function find(list, id) { for (let i = 0; i < list.length; i++) if (list[i].id === id) return list[i]; return null; }

  /* ---------- saved state ---------- */
  function startBackdrop() {
    return find(SHOP.backdrops, SHOP.defaultBackdrop) ? SHOP.defaultBackdrop : SHOP.backdrops[0].id;
  }
  let S = freshState();
  function freshState() {
    return {
      launched: false,                 // has the game been opened before
      level: 1,                        // level being played
      cleared: 0,                      // highest level cleared (highest reached = cleared + 1)
      board: null,                     // current tubes
      pours: 0,                        // pour counter
      history: [],                     // undo list: [from, to, bands]
      extra: 0,                        // extra tubes added this level
      won: false,                      // current board was just cleared (win pop-up)
      done: false,                     // looking at a level cleared earlier (shown finished, not played)
      stash: null,                     // an unfinished level set aside while looking at cleared ones
      coins: 0,
      bought: [],                      // shop items paid for, e.g. "backdrops:forest"
      tube: SHOP.tubes[0].id,
      backdrop: startBackdrop(),
      backdropPicked: false,           // true once the player has chosen a backdrop in the shop
      colours: SHOP.colourSets[0].id,
      sound: true, buzz: true, symbols: false
    };
  }
  function save() {
    try { localStorage.setItem(CONFIG.saveKey, JSON.stringify(S)); } catch (e) { /* storage blocked or full */ }
  }
  function validBoard(b) {
    if (!Array.isArray(b) || b.length < 2) return false;
    return b.every(function (t) {
      return Array.isArray(t) && t.length <= CAP && t.every(function (c) {
        return Number.isInteger(c) && c >= 0 && c < SHOP.colourCount;
      });
    });
  }
  function load() {
    try {
      const raw = localStorage.getItem(CONFIG.saveKey);
      if (!raw) return;
      const data = JSON.parse(raw);
      if (!data || typeof data !== 'object') return;
      const d = Object.assign(freshState(), data);
      d.cleared = Math.max(0, Math.floor(+d.cleared || 0));
      d.level = Math.min(Math.max(1, Math.floor(+d.level || 1)), d.cleared + 1);
      d.coins = Math.max(0, Math.floor(+d.coins || 0));
      d.pours = Math.max(0, Math.floor(+d.pours || 0));
      d.extra = Math.max(0, Math.floor(+d.extra || 0));
      if (!Array.isArray(d.bought)) d.bought = [];
      if (!Array.isArray(d.history)) d.history = [];
      if (!validBoard(d.board)) { d.board = null; d.history = []; d.pours = 0; d.extra = 0; d.won = false; d.done = false; }
      if (!d.stash || typeof d.stash !== 'object' || !validBoard(d.stash.board) || !Array.isArray(d.stash.history)) d.stash = null;
      if (!find(SHOP.tubes, d.tube)) d.tube = SHOP.tubes[0].id;
      if (!find(SHOP.backdrops, d.backdrop)) d.backdrop = startBackdrop();
      /* A player who has never chosen or bought a backdrop follows the default, even if it changes */
      const boughtBackdrop = d.bought.some(function (b) { return String(b).indexOf('backdrops:') === 0; });
      if (!d.backdropPicked && !boughtBackdrop) d.backdrop = startBackdrop();
      if (!find(SHOP.colourSets, d.colours)) d.colours = SHOP.colourSets[0].id;
      S = d;
    } catch (e) { /* unreadable save: start fresh */ }
  }

  /* ---------- sound and vibration ---------- */
  const Sound = {
    ctx: null,
    get: function () {
      if (!S.sound) return null;
      try {
        if (!this.ctx) {
          const AC = window.AudioContext || window.webkitAudioContext;
          if (!AC) return null;
          this.ctx = new AC();
        }
        if (this.ctx.state === 'suspended') this.ctx.resume();
        return this.ctx;
      } catch (e) { return null; }
    },
    /* One tone gliding from one pitch to another. hold = keep it loud until the end. */
    tone: function (from, to, ms, type, gain, delayMs, hold) {
      const c = this.get();
      if (!c) return;
      try {
        const t0 = c.currentTime + (delayMs || 0) / 1000, t1 = t0 + ms / 1000;
        const osc = c.createOscillator(), amp = c.createGain();
        const v = Math.max(0.0002, SND.volume * gain);
        osc.type = type;
        osc.frequency.setValueAtTime(from, t0);
        if (to !== from) osc.frequency.exponentialRampToValueAtTime(to, t1);
        amp.gain.setValueAtTime(0.0001, t0);
        amp.gain.exponentialRampToValueAtTime(v, t0 + 0.012);
        if (hold) amp.gain.setValueAtTime(v, Math.max(t0 + 0.013, t1 - 0.06));
        amp.gain.exponentialRampToValueAtTime(0.0001, t1);
        osc.connect(amp); amp.connect(c.destination);
        osc.start(t0); osc.stop(t1 + 0.03);
      } catch (e) { /* audio not available */ }
    },
    select: function () { this.tone(SND.select, SND.select, SND.selectMs, 'triangle', 0.8); },
    pour: function (ms) { this.tone(SND.pourFrom, SND.pourTo, ms, 'sine', 0.55, 0, true); },
    cork: function () { this.tone(SND.cork, SND.cork * 0.55, SND.corkMs, 'sine', 1.6); },
    win: function () {
      for (let i = 0; i < SND.win.length; i++) this.tone(SND.win[i], SND.win[i], SND.winNoteMs, 'triangle', 1, i * SND.winGapMs);
    }
  };
  function buzz(pattern) {
    if (!S.buzz || !navigator.vibrate) return;
    try { navigator.vibrate(pattern); } catch (e) { /* not allowed */ }
  }

  /* ---------- confetti ---------- */
  const confettiEl = $('confetti');
  function cssColour(name) { return getComputedStyle(root).getPropertyValue(name).trim(); }
  const Confetti = {
    ctx: null, bits: [], raf: 0, last: 0, w: 0, h: 0,
    fit: function () {
      const dpr = Math.min(window.devicePixelRatio || 1, 2);
      this.w = window.innerWidth; this.h = window.innerHeight;
      confettiEl.width = Math.round(this.w * dpr);
      confettiEl.height = Math.round(this.h * dpr);
      this.ctx = confettiEl.getContext('2d');
      if (this.ctx) this.ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    },
    /* Throw a number of pieces from (x, y). angle: middle direction in degrees (-90 = straight up),
       spread: width of the fan in degrees, speed: pixels per second. */
    burst: function (x, y, count, colours, angle, spread, speed, lifeMs) {
      if (motionOff() || count <= 0 || !colours.length) return;
      if (!this.ctx || this.w !== window.innerWidth || this.h !== window.innerHeight) this.fit();
      if (!this.ctx) return;
      for (let i = 0; i < count && this.bits.length < A.confettiMax; i++) {
        const a = (angle + (Math.random() - 0.5) * spread) * Math.PI / 180;
        const v = speed * (0.4 + Math.random() * 0.8);
        this.bits.push({
          x: x, y: y, vx: Math.cos(a) * v, vy: Math.sin(a) * v,
          size: A.confettiSize * (0.5 + Math.random() * 0.5),
          round: Math.random() < 0.22,
          rot: Math.random() * 6.28, spin: (Math.random() - 0.5) * 14,
          flip: Math.random() * 6.28, flipSpeed: 5 + Math.random() * 9,
          colour: colours[Math.floor(Math.random() * colours.length)],
          age: 0, life: lifeMs / 1000 * (0.65 + Math.random() * 0.5)
        });
      }
      if (!this.raf) { this.last = performance.now(); this.raf = requestAnimationFrame(confettiStep); }
    }
  };
  function confettiStep(now) {
    const C = Confetti, ctx = C.ctx;
    const dt = Math.min(0.034, Math.max(0.001, (now - C.last) / 1000));
    C.last = now;
    const keep = Math.exp(-A.confettiDrag * dt);
    ctx.clearRect(0, 0, C.w, C.h);
    for (let i = C.bits.length - 1; i >= 0; i--) {
      const b = C.bits[i];
      b.age += dt;
      if (b.age >= b.life || b.y > C.h + 30) { C.bits.splice(i, 1); continue; }
      b.vy += A.confettiGravity * dt;
      b.vx *= keep; b.vy *= keep;
      b.x += b.vx * dt; b.y += b.vy * dt;
      b.rot += b.spin * dt; b.flip += b.flipSpeed * dt;
      ctx.save();
      ctx.globalAlpha = Math.min(1, (b.life - b.age) / 0.35);   // fade out at the end
      ctx.translate(b.x, b.y);
      ctx.rotate(b.rot);
      ctx.scale(1, Math.cos(b.flip));                           // flutter
      ctx.fillStyle = b.colour;
      if (b.round) { ctx.beginPath(); ctx.arc(0, 0, b.size * 0.42, 0, 6.2832); ctx.fill(); }
      else ctx.fillRect(-b.size / 2, -b.size * 0.3, b.size, b.size * 0.6);
      ctx.restore();
    }
    if (C.bits.length) C.raf = requestAnimationFrame(confettiStep);
    else { C.raf = 0; ctx.clearRect(0, 0, C.w, C.h); }
  }
  /* Small burst out of the mouth of a tube that was just finished, in its own colour. */
  function tubeConfetti(i) {
    const t = tubes[i];
    if (!t || !S.board[i].length) return;
    const r = t.slot.getBoundingClientRect();
    const own = cssColour('--liq-' + S.board[i][0]);
    const colours = [own, own, own, cssColour('--confetti-light'), cssColour('--gold-light')];
    Confetti.burst(r.left + r.width / 2, r.top, A.confettiTube, colours, -90, 120, A.confettiTubeSpeed, A.confettiTubeLife);
  }
  /* Big shower when every tube is finished: two side cannons, then a fall from the top. */
  function megaConfetti() {
    const r = appEl.getBoundingClientRect(), n = A.confettiWin;
    const colours = [cssColour('--confetti-light'), cssColour('--gold-light')];
    for (let c = 0; c < SHOP.colourCount; c++) colours.push(cssColour('--liq-' + c));
    const y = r.top + r.height * 0.72;
    Confetti.burst(r.left, y, Math.round(n * 0.3), colours, -60, 44, A.confettiWinSpeed, A.confettiWinLife);
    Confetti.burst(r.right, y, Math.round(n * 0.3), colours, -120, 44, A.confettiWinSpeed, A.confettiWinLife);
    const columns = 8, each = Math.round(n * 0.4 / columns);
    setTimeout(function () {
      for (let k = 0; k < columns; k++) {
        Confetti.burst(r.left + r.width * (k + 0.5) / columns, r.top - 12, each, colours, 90, 150, 240, A.confettiWinLife);
      }
    }, 260);
  }

  /* ---------- game state that is not saved ---------- */
  let tubes = [];          // [{ el, slot, liq }] one per tube on screen
  let geom = { tw: 40, bh: 32, th: 150, per: 1 };
  let sel = null;          // selected tube index
  let hint = null;         // [from, to] marked by Hint
  let plan = null;         // solver's remaining moves, so repeated hints follow one solution
  let statusMsg = '';      // one-off message under the tubes
  let stuck = false;       // no useful pour left
  let busy = false;        // a pour animation is running
  let filling = -1;        // tube being filled by the running animation
  let animToken = 0;       // changes whenever an animation is cancelled
  let queue = [];          // taps made during a pour
  let winInfo = { first: false, awards: [] };
  let currentScreen = 'game';
  let shopTab = 'tubes';
  let lastPointerDown = 0;
  let handEl = null;

  function isTut() { return Engine.isTutorial(S.level, L); }
  function reached() { return S.cleared + 1; }

  /* =====================================================================
     Drawing the board
     ===================================================================== */
  function makeBand(c) {
    const b = el('span', 'band');
    b.dataset.c = c;
    b.style.setProperty('--c', 'var(--liq-' + c + ')');
    b.innerHTML = '<svg class="sym" aria-hidden="true"><use href="#sym-' + c + '"/></svg>';
    return b;
  }
  /* Make the band elements of one tube match the board. */
  function syncBands(i) {
    const liq = tubes[i].liq, t = S.board[i];
    for (let k = 0; k < t.length; k++) {
      const have = liq.children[k];
      if (have && +have.dataset.c !== t[k]) { while (liq.children.length > k) liq.lastChild.remove(); }
      if (!liq.children[k]) liq.appendChild(makeBand(t[k]));
    }
    while (liq.children.length > t.length) liq.lastChild.remove();
  }
  function resetBands(i) { tubes[i].liq.textContent = ''; syncBands(i); }

  function buildBoard() {
    boardEl.textContent = '';
    tubes = [];
    const n = S.board.length;
    const rows = n > G.rowMax ? 2 : 1, per = Math.ceil(n / rows);
    let row = null;
    for (let i = 0; i < n; i++) {
      if (i % per === 0) { row = el('div', 'row'); boardEl.appendChild(row); }
      const slot = el('div', 'slot');
      const btn = el('button', 'tube');
      btn.type = 'button';
      btn.dataset.i = i;
      const glass = el('span', 'glass'), liq = el('span', 'liquid');
      glass.appendChild(liq);
      glass.appendChild(el('span', 'shine'));
      btn.appendChild(el('span', 'cork'));
      btn.appendChild(glass);
      slot.appendChild(btn);
      row.appendChild(slot);
      tubes.push({ el: btn, slot: slot, liq: liq });
      syncBands(i);
    }
    geom.per = per;
    layout();
  }

  /* Work out tube size from the space available so nothing scrolls. */
  function layout() {
    if (!S.board) return;
    const n = S.board.length;
    const rows = n > G.rowMax ? 2 : 1, per = Math.ceil(n / rows);
    const W = boardEl.clientWidth, H = boardEl.clientHeight;
    if (!W || !H) return;
    const unitsPerRow = CAP * G.bandRatio + G.headroom + G.lift;
    const need = function (tw) { return rows * (tw * unitsPerRow + G.shelfSpace) + (rows - 1) * tw * G.rowGap; };
    let tw = Math.min(G.tubeMaxWidth, (W / per) * G.tubeFill);
    if (need(tw) > H) tw = (H - rows * G.shelfSpace) / (rows * unitsPerRow + (rows - 1) * G.rowGap);
    tw = Math.max(G.tubeMinWidth, Math.floor(tw));
    /* stretch the bands when there is height to spare, without making tubes too tall to tilt on screen */
    const fitH = ((H - rows * G.shelfSpace - (rows - 1) * tw * G.rowGap) / (rows * tw) - G.headroom - G.lift) / CAP;
    const fitW = (W * G.tubeMaxHeight / tw - G.headroom) / CAP;
    const ratio = Math.max(G.bandRatio, Math.min(G.bandRatioMax, fitH, fitW));
    const bh = Math.max(4, Math.floor(tw * ratio));
    const th = CAP * bh + Math.round(tw * G.headroom);
    const gap = Math.max(3, Math.floor(Math.min(tw * G.gapMax, (W - per * tw) / per)));
    const st = boardEl.style;
    st.setProperty('--tw', tw + 'px');
    st.setProperty('--bh', bh + 'px');
    st.setProperty('--th', th + 'px');
    st.setProperty('--lift', Math.round(tw * G.lift) + 'px');
    st.setProperty('--gap', gap + 'px');
    st.setProperty('--row-gap', Math.round(tw * G.rowGap) + 'px');
    st.setProperty('--shelf-space', G.shelfSpace + 'px');
    geom.tw = tw; geom.bh = bh; geom.th = th; geom.per = per;
  }

  function tubeLabel(i) {
    const t = S.board[i], names = T.colourNames;
    if (!t.length) return fmt(T.tubeEmpty, { i: i + 1 });
    if (Engine.isFinished(t, CAP)) return fmt(T.tubeDone, { i: i + 1, c: names[t[0]] });
    return fmt(T.tubeMixed, { i: i + 1, list: t.slice().reverse().map(function (c) { return names[c]; }).join(', ') });
  }
  /* Update one tube's classes and spoken label in place (no rebuilding). */
  function paintTube(i) {
    const t = tubes[i];
    if (!t) return;
    const done = i !== filling && Engine.isFinished(S.board[i], CAP);
    t.el.classList.toggle('sel', sel === i);
    t.el.classList.toggle('done', done);
    t.el.classList.toggle('hint-from', !!hint && hint[0] === i);
    t.el.classList.toggle('hint-to', !!hint && hint[1] === i);
    t.el.setAttribute('aria-label', tubeLabel(i));
    t.el.setAttribute('aria-pressed', sel === i ? 'true' : 'false');
    if (done) t.el.setAttribute('aria-disabled', 'true'); else t.el.removeAttribute('aria-disabled');
  }
  function paintAll() { for (let i = 0; i < tubes.length; i++) paintTube(i); }

  function paintHud() {
    $('levelName').textContent = fmt(T.level, { n: S.level });
    $('pours').textContent = poursText(S.pours);
    $('btnPrev').disabled = S.level <= 1;
    $('btnNext').disabled = S.level >= reached();
    const tut = isTut();
    const over = S.won || S.done;
    $('btnUndo').disabled = over || !S.history.length;
    $('btnHint').disabled = over || tut;
    $('btnAdd').disabled = over || tut || S.extra >= L.extraTubes;
  }
  function paintStatus() {
    let msg = statusMsg;
    if (S.done) msg = msg || T.levelDone;
    else if (isTut() && !S.won) msg = sel === null ? T.tutorialFirst : T.tutorialSecond;
    else if (!msg && stuck && !S.won) msg = T.stuck;
    if (statusEl.textContent !== msg) statusEl.textContent = msg;
  }
  function announce(msg) { srEl.textContent = msg; }

  /* The tutorial hand sits under the tube to tap next. */
  function placeHand() {
    if (!isTut() || S.won || S.done) { if (handEl) handEl.remove(); return; }
    if (!handEl) {
      handEl = el('span', 'hand');
      handEl.setAttribute('aria-hidden', 'true');
      if (IMG.hand) {
        const im = el('img'); im.src = IMG.hand; im.alt = '';
        handEl.appendChild(im);
      } else {
        handEl.innerHTML = '<svg viewBox="0 0 48 58"><path d="M16 7a5 5 0 0 1 10 0v18l11 2.600a6 6 0 0 1 4.600 6.600l-1.700 13a8 8 0 0 1-7.900 6.800H21.500a8 8 0 0 1-6.600-3.500L5.600 38a3.500 3.500 0 0 1 5.400-4.400l5 4.400z"/></svg>';
      }
    }
    let target = L.tutorialFirstTube;
    if (sel !== null) {
      target = -1;
      for (let i = 0; i < S.board.length; i++) if (Engine.canPour(S.board, sel, i, CAP)) { target = i; break; }
    }
    if (target < 0 || !tubes[target]) { handEl.remove(); return; }
    if (handEl.parentNode !== tubes[target].slot) tubes[target].slot.appendChild(handEl);
  }

  function refresh() {
    stuck = !S.won && !S.done && !Engine.hasMoves(S.board, CAP);
    paintAll(); paintHud(); paintStatus(); placeHand();
  }

  /* =====================================================================
     Playing
     ===================================================================== */
  /* Open a level.
     mode 'saved' = carry on with the saved board (start-up).
     mode 'fresh' = deal it again to play (Restart).
     no mode      = arrive at the level: a level you already cleared is shown finished and
                    stays cleared; an unfinished level you left comes back as you left it. */
  function openLevel(n, mode) {
    cancelAnim();
    if (mode !== 'saved' || !S.board) {
      const leavingUnfinished = S.board && S.level !== n && !S.won && !S.done && S.history.length > 0;
      if (leavingUnfinished) {
        S.stash = { level: S.level, board: S.board, pours: S.pours, history: S.history, extra: S.extra };
      }
      S.won = false; S.done = false;
      if (mode !== 'fresh' && S.stash && S.stash.level === n) {
        S.board = S.stash.board; S.pours = S.stash.pours; S.history = S.stash.history; S.extra = S.stash.extra;
        S.stash = null;
      } else {
        if (S.stash && S.stash.level === n) S.stash = null;
        S.board = Engine.makeLevel(n, L, SHOP.colourCount);
        S.pours = 0; S.history = []; S.extra = 0;
        if (mode !== 'fresh' && n <= S.cleared) {
          S.board = Engine.finishedBoard(S.board, CAP, L.hintNodes);
          S.done = true;
        }
      }
    }
    S.level = n;
    sel = null; hint = null; plan = null; statusMsg = '';
    buildBoard();
    refresh();
    save();
  }

  function tapTube(i) {
    if (S.won || S.done || !tubes[i]) return;
    if (busy) { if (queue.length < A.queueMax) queue.push(i); return; }
    const b = S.board;
    hint = null;
    statusMsg = '';
    if (sel === i) {
      sel = null;                                            // tap again: put it down
    } else if (sel !== null && Engine.canPour(b, sel, i, CAP)) {
      startPour(sel, i);
      return;
    } else if (Engine.isFinished(b[i], CAP)) {
      statusMsg = T.tubeIsDone;                              // corked tubes cannot be picked
    } else if (!b[i].length) {
      statusMsg = T.tubeIsEmpty;
    } else {
      sel = i;                                               // pick it (also when the pour was not allowed)
      Sound.select(); buzz(SND.buzzSelect);
    }
    paintAll(); paintStatus(); placeHand();
  }

  function startPour(from, to) {
    const colour = S.board[from][S.board[from].length - 1];
    const before = S.board[to].length;
    const n = Engine.pour(S.board, from, to, CAP);
    S.history.push([from, to, n]);
    S.pours++;
    const next = plan && plan.moves[plan.i];
    if (next && next[0] === from && next[1] === to) plan.i++; else plan = null;
    sel = null;
    const done = Engine.isFinished(S.board[to], CAP);
    if (Engine.isCleared(S.board, CAP)) settleWin();
    save();
    announce(fmt(T.srPoured, { n: n, c: T.colourNames[colour], b: to + 1 }));

    if (motionOff()) {
      syncBands(from); syncBands(to);
      paintAll(); paintHud();
      if (done) corked(to);
      afterPour();
      return;
    }
    busy = true;
    filling = to;
    paintAll(); paintHud(); paintStatus();
    if (handEl) handEl.remove();
    animatePour(from, to, n, colour, before, done).then(function (finished) {
      if (finished) afterPour();
    });
  }

  /* The pour: fly over, tilt, stream, move the liquid, stream off, fly back. */
  async function animatePour(from, to, n, colour, before, done) {
    const token = ++animToken;
    const live = function () { return token === animToken; };
    const src = tubes[from], dst = tubes[to];
    const sr = src.slot.getBoundingClientRect(), dr = dst.slot.getBoundingClientRect();
    const app = appEl.getBoundingClientRect();
    const rad = A.tiltAngle * Math.PI / 180;
    const lipX = geom.tw / 2 * Math.cos(rad), lipY = geom.tw / 2 * Math.sin(rad);
    const reach = geom.th * Math.sin(rad);
    const cx = dr.left + dr.width / 2;
    /* dir 1: the tube comes in on the left of the target and tilts clockwise */
    let dir = sr.left < dr.left - 1 ? 1 : sr.left > dr.left + 1 ? -1 : (cx > app.left + app.width / 2 ? 1 : -1);
    const spill = function (d) { return d === 1 ? Math.max(0, app.left - (cx - reach)) : Math.max(0, cx + reach - app.right); };
    if (spill(dir) > spill(-dir)) dir = -dir;                // keep the tilted tube on screen
    const hover = geom.tw * A.hover;
    const dx = cx - dir * lipX - (sr.left + sr.width / 2);
    const dy = dr.top - hover - lipY - sr.top;

    src.el.classList.add('pouring');
    src.el.style.transition = 'translate ' + A.travel + 'ms ease-in-out, rotate ' + A.tilt + 'ms ease-in-out ' + A.tiltDelay + 'ms';
    src.el.style.translate = dx + 'px ' + dy + 'px';
    src.el.style.rotate = (dir * A.tiltAngle) + 'deg';
    await sleep(Math.max(A.travel, A.tiltDelay + A.tilt));
    if (!live()) return false;

    /* stream from the pouring lip down to the liquid surface in the target */
    const sw = Math.max(3, Math.round(geom.tw * A.streamWidth));
    const y0 = dr.top - hover - 1, y1 = dr.top + geom.th - 2 - before * geom.bh;
    const stream = el('i', 'stream');
    stream.style.cssText = 'left:' + (cx - sw / 2) + 'px;top:' + y0 + 'px;width:' + sw + 'px;height:' + Math.max(4, y1 - y0) + 'px;transition-duration:' + A.streamIn + 'ms';
    stream.style.setProperty('--c', 'var(--liq-' + colour + ')');
    fxEl.appendChild(stream);
    stream.getBoundingClientRect();
    stream.style.transform = 'scaleY(1)';
    await sleep(A.streamIn);
    if (!live()) return false;

    /* source bands shrink while target bands grow */
    const time = A.pourBase + A.pourPerBand * n;
    Sound.pour(time);
    const leaving = Array.prototype.slice.call(src.liq.children, -n);
    const arriving = [];
    leaving.forEach(function (b) { b.style.transitionDuration = time + 'ms'; });
    for (let k = 0; k < n; k++) {
      const b = makeBand(colour);
      b.style.height = '0px';
      b.style.transitionDuration = time + 'ms';
      dst.liq.appendChild(b);
      arriving.push(b);
    }
    dst.liq.getBoundingClientRect();
    leaving.forEach(function (b) { b.style.height = '0px'; });
    arriving.forEach(function (b) { b.style.height = ''; });
    await sleep(time);
    if (!live()) return false;
    leaving.forEach(function (b) { b.remove(); });
    arriving.forEach(function (b) { b.style.transitionDuration = ''; });
    filling = -1;
    paintTube(to);
    if (done) corked(to);

    /* stream retracts into the target, then the tube goes home */
    stream.style.transitionDuration = A.streamOut + 'ms';
    stream.style.transformOrigin = '50% 100%';
    stream.style.transform = 'scaleY(0)';
    await sleep(A.streamOut);
    if (!live()) return false;
    stream.remove();
    src.el.style.transition = 'translate ' + A.back + 'ms ease-in-out, rotate ' + A.back + 'ms ease-in-out';
    src.el.style.translate = '';
    src.el.style.rotate = '';
    await sleep(A.back);
    if (!live()) return false;
    src.el.style.transition = '';
    src.el.classList.remove('pouring');
    busy = false;
    return true;
  }

  /* A tube was just finished: pop, cork, thud, confetti. */
  function corked(i) {
    const t = tubes[i].el;
    t.classList.remove('pop');
    void t.offsetWidth;
    t.classList.add('pop');
    Sound.cork(); buzz(SND.buzzCork);
    tubeConfetti(i);
  }

  function afterPour() {
    if (S.won) {
      queue.length = 0;
      refresh();
      Sound.win(); buzz(SND.buzzWin);
      megaConfetti();
      const token = animToken;
      setTimeout(function () { if (token === animToken && S.won) showWin(); }, motionOff() ? 0 : A.winDelay);
      return;
    }
    refresh();
    while (queue.length && !busy) tapTube(queue.shift());   // play taps made during the pour
  }

  /* Stop any running pour at once and show the true board. */
  function cancelAnim() {
    animToken++;
    queue.length = 0;
    filling = -1;
    if (!busy) return;
    busy = false;
    fxEl.textContent = '';
    for (let i = 0; i < tubes.length; i++) {
      const t = tubes[i].el;
      t.style.transition = ''; t.style.translate = ''; t.style.rotate = '';
      t.classList.remove('pouring');
      resetBands(i);
    }
    paintAll();
  }

  function awardsEarned() {
    return CONFIG.awards.filter(function (a) {
      return a.type === 'buy' ? S.bought.length >= a.value : S.cleared >= a.value;
    }).map(function (a) { return a.name; });
  }
  function newAwards(before) {
    return awardsEarned().filter(function (name) { return before.indexOf(name) < 0; });
  }

  function settleWin() {
    const before = awardsEarned();
    const first = S.level > S.cleared;
    if (first) { S.cleared = S.level; S.coins += L.coinsPerLevel; }
    S.won = true;
    winInfo = { first: first, awards: newAwards(before) };
  }
  function showWin() {
    if (winEl.classList.contains('on')) return;
    $('winTitle').textContent = fmt(T.winTitle, { n: S.level });
    $('winBody').textContent = fmt(winInfo.first ? T.winBody : T.winBodyReplay, { pours: poursText(S.pours), coins: L.coinsPerLevel });
    $('winAward').textContent = winInfo.awards.length ? fmt(T.awardEarned, { name: winInfo.awards.join(', ') }) : '';
    openPop(winEl, $('winNext'));
  }

  function undo() {
    cancelAnim();
    if (S.won) { showWin(); return; }
    if (S.done) return;
    const m = S.history.pop();
    if (!m) return;
    Engine.unpour(S.board, m[0], m[1], m[2]);
    S.pours = Math.max(0, S.pours - 1);
    sel = null; hint = null; plan = null; statusMsg = T.undone;
    syncBands(m[0]); syncBands(m[1]);
    refresh(); save();
  }

  function showHint() {
    cancelAnim();
    if (S.won) { showWin(); return; }
    if (S.done || isTut()) return;
    sel = null;
    if (!plan || !plan.moves[plan.i]) {
      const result = Engine.solve(S.board, CAP, L.hintNodes);
      if (!result.solved) {
        hint = null; plan = null;
        statusMsg = result.exhausted ? T.hintNone : T.hintUnsure;
        paintAll(); paintStatus();
        return;
      }
      plan = { moves: result.moves, i: 0 };
    }
    const m = plan.moves[plan.i];
    if (!m) return;
    hint = [m[0], m[1]];
    statusMsg = fmt(T.hintSay, { a: m[0] + 1, b: m[1] + 1 });
    paintAll(); paintStatus();
  }

  function addTube() {
    cancelAnim();
    if (S.won) { showWin(); return; }
    if (S.done || isTut() || S.extra >= L.extraTubes) return;
    S.board.push([]);
    S.extra++;
    sel = null; hint = null; plan = null; statusMsg = T.tubeAdded;
    buildBoard(); refresh(); save();
    $('btnRestart').focus({ preventScroll: true });
  }

  function restart() {
    openLevel(S.level, 'fresh');
    statusMsg = T.restarted;
    paintStatus();
  }
  function stepLevel(d) {
    const n = S.level + d;
    if (n < 1 || n > reached()) return;
    openLevel(n);
  }

  /* =====================================================================
     Screens and pop-ups
     ===================================================================== */
  function show(name) {
    Object.keys(screens).forEach(function (k) {
      const on = k === name;
      screens[k].classList.toggle('on', on);
      screens[k].inert = !on;
    });
    currentScreen = name;
    if (name === 'game') layout();
  }
  let popReturnFocus = null;
  function openPop(pop, focusEl) {
    popReturnFocus = document.activeElement;
    screens[currentScreen].inert = true;
    pop.classList.add('on');
    setTimeout(function () { if (pop.classList.contains('on')) focusEl.focus({ preventScroll: true }); }, 60);
  }
  function closePop(pop) {
    if (!pop.classList.contains('on')) return;
    pop.classList.remove('on');
    screens[currentScreen].inert = false;
    if (popReturnFocus && popReturnFocus.focus) popReturnFocus.focus({ preventScroll: true });
    popReturnFocus = null;
  }

  function coinsEverywhere() {
    $('homeCoins').textContent = S.coins;
    $('shopCoins').textContent = S.coins;
    const spoken = fmt(T.coinsSpoken, { n: S.coins });
    $('homeCoinPill').setAttribute('aria-label', spoken);
    $('shopCoinPill').setAttribute('aria-label', spoken);
    $('homeCoinPill').setAttribute('role', 'img');
    $('shopCoinPill').setAttribute('role', 'img');
  }
  function renderHome() {
    $('homeLevel').textContent = S.level;
    coinsEverywhere();
    $('btnSound').classList.toggle('off', !S.sound);
    $('btnSound').setAttribute('aria-pressed', S.sound ? 'true' : 'false');
    $('lblSound').textContent = S.sound ? T.soundOn : T.soundOff;
    $('btnBuzz').classList.toggle('off', !S.buzz);
    $('btnBuzz').setAttribute('aria-pressed', S.buzz ? 'true' : 'false');
    $('lblBuzz').textContent = S.buzz ? T.buzzOn : T.buzzOff;
  }
  function goHome() {
    cancelAnim();
    if (S.won) closePop(winEl);
    if (S.won || S.done) openLevel(reached());     // Home always leads back to the level still to clear
    sel = null; hint = null;
    paintAll(); paintStatus(); placeHand();
    renderHome();
    show('home');
    $('btnPlay').focus({ preventScroll: true });
  }
  function nextLevel() {
    closePop(winEl);
    openLevel(Math.min(S.level + 1, reached()));
  }

  /* Apply the chosen tube, backdrop, colour set and symbols to the page. */
  function applyLook() {
    root.dataset.backdrop = S.backdrop;
    root.dataset.colours = S.colours;
    boardEl.dataset.tube = S.tube;
    root.classList.toggle('symbols', !!S.symbols);
    $('chkSymbols').checked = !!S.symbols;
    const bd = find(SHOP.backdrops, S.backdrop);
    const pic = (bd && bd.image) || IMG.background;
    $('bg').style.setProperty('--bg-image', pic ? 'url("' + pic + '")' : 'none');
  }

  /* ---------- shop ---------- */
  function shopSay(msg) { $('shopMsg').textContent = msg; }
  function openShop(tab) {
    shopTab = tab;
    shopSay('');
    renderShop();
    show('shop');
    $('btnBack').focus({ preventScroll: true });
  }
  function previewFor(kind, item) {
    const p = el('span', 'preview');
    if (kind === 'tubes') {
      p.dataset.tube = item.id;
      const tube = el('span', 'tube done'), glass = el('span', 'glass'), liq = el('span', 'liquid');
      [5, 5, 2, 8].forEach(function (c) {
        const b = el('span', 'band');
        b.style.setProperty('--c', 'var(--liq-' + c + ')');
        liq.appendChild(b);
      });
      glass.appendChild(liq); glass.appendChild(el('span', 'shine'));
      tube.appendChild(glass);
      p.appendChild(tube);
    } else if (kind === 'backdrops') {
      p.className = 'preview swatch';
      p.dataset.backdrop = item.id;
      if (item.image) p.style.backgroundImage = 'url("' + item.image + '")';
    } else {
      p.className = 'preview dots';
      p.dataset.colours = item.id;
      for (let c = 0; c < SHOP.colourCount; c++) {
        const dot = el('i');
        dot.style.setProperty('--c', 'var(--liq-' + c + ')');
        p.appendChild(dot);
      }
    }
    return p;
  }
  function shopItems(kind) { return kind === 'tubes' ? SHOP.tubes : kind === 'backdrops' ? SHOP.backdrops : SHOP.colourSets; }
  function chosenKey(kind) { return kind === 'tubes' ? 'tube' : kind === 'backdrops' ? 'backdrop' : 'colours'; }
  function isOwned(kind, item) {
    if (kind === 'tubes') return reached() >= item.level;
    return !item.price || S.bought.indexOf(kind + ':' + item.id) >= 0;
  }
  function renderShop(focusId) {
    coinsEverywhere();
    document.querySelectorAll('.tab').forEach(function (tab) {
      const on = tab.dataset.tab === shopTab;
      tab.classList.toggle('accent', on);
      tab.classList.toggle('frost', on);
      tab.setAttribute('aria-selected', on ? 'true' : 'false');
    });
    const grid = $('shopGrid');
    grid.textContent = '';
    shopItems(shopTab).forEach(function (item) {
      const owned = isOwned(shopTab, item), using = S[chosenKey(shopTab)] === item.id;
      let state;
      if (using) state = T.inUse;
      else if (owned) state = T.tapToUse;
      else if (shopTab === 'tubes') state = fmt(T.reachLevel, { n: item.level });
      else state = fmt(T.price, { n: item.price });
      const card = el('button', 'frost btn card-btn' + (using ? ' in-use' : '') + (owned ? '' : ' locked'));
      card.type = 'button';
      card.dataset.id = item.id;
      card.appendChild(previewFor(shopTab, item));
      card.appendChild(el('span', 'card-name', item.name));
      card.appendChild(el('span', 'card-state', state));
      grid.appendChild(card);
      if (focusId === item.id) card.focus({ preventScroll: true });
    });
  }
  function pickShopItem(id) {
    const kind = shopTab, item = find(shopItems(kind), id);
    if (!item) return;
    let msg;
    if (!isOwned(kind, item)) {
      if (kind === 'tubes') { shopSay(fmt(T.needLevel, { n: item.level, name: item.name })); return; }
      if (S.coins < item.price) { shopSay(fmt(T.needCoins, { n: item.price - S.coins })); return; }
      const before = awardsEarned();
      S.coins -= item.price;
      S.bought.push(kind + ':' + item.id);
      msg = fmt(T.bought, { name: item.name });
      const got = newAwards(before);
      if (got.length) msg += ' ' + fmt(T.awardEarned, { name: got.join(', ') });
    } else {
      msg = fmt(T.nowUsing, { name: item.name });
    }
    S[chosenKey(kind)] = item.id;
    if (kind === 'backdrops') S.backdropPicked = true;
    applyLook();
    save();
    renderShop(item.id);
    shopSay(msg);
  }

  /* ---------- awards ---------- */
  function openAwards() {
    const list = $('awardList'), have = awardsEarned();
    list.textContent = '';
    CONFIG.awards.forEach(function (a) {
      const got = have.indexOf(a.name) >= 0;
      const li = el('li', got ? 'earned' : '');
      const tick = el('span', 'tick');
      tick.innerHTML = '<svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="m5 12.500 4.500 4.500L19 7.500"/></svg>';
      const body = el('span');
      body.appendChild(el('b', '', a.name));
      body.appendChild(el('small', '', a.how));
      body.appendChild(el('span', 'sr-only', ', ' + (got ? T.earned : T.notEarned)));
      li.appendChild(tick); li.appendChild(body);
      list.appendChild(li);
    });
    openPop(awardsEl, $('awardsClose'));
  }

  /* =====================================================================
     Start-up: labels, pictures, buttons, touch and keyboard
     ===================================================================== */
  function applyText() {
    document.title = T.title;
    document.querySelectorAll('[data-t]').forEach(function (e) { e.textContent = T[e.dataset.t] || ''; });
    document.querySelectorAll('[data-tl]').forEach(function (e) { e.setAttribute('aria-label', T[e.dataset.tl] || ''); });
  }
  function applyImages() {
    if (IMG.logo) {
      const im = el('img'); im.src = IMG.logo; im.alt = T.title;
      $('homeTitle').textContent = ''; $('homeTitle').appendChild(im);
    }
    if (IMG.homeBadge) {
      $('homeBadge').classList.add('img');
      $('homeBadge').classList.remove('frost');
      $('homeBadge').style.setProperty('--badge-image', 'url("' + IMG.homeBadge + '")');
    }
    if (IMG.coin) {
      root.classList.add('coin-img');
      root.style.setProperty('--coin-image', 'url("' + IMG.coin + '")');
    }
  }

  function bind() {
    /* Tubes answer on pointer-down so there is no tap delay. Keyboard and
       screen-reader activation arrive as a click with no pointer-down. */
    boardEl.addEventListener('pointerdown', function (e) {
      const t = e.target.closest('.tube');
      if (!t || (e.pointerType === 'mouse' && e.button !== 0)) return;
      lastPointerDown = performance.now();
      tapTube(+t.dataset.i);
    });
    boardEl.addEventListener('click', function (e) {
      const t = e.target.closest('.tube');
      if (!t || performance.now() - lastPointerDown < 700) return;
      tapTube(+t.dataset.i);
    });
    boardEl.addEventListener('keydown', function (e) {
      const t = e.target.closest('.tube');
      if (!t) return;
      const i = +t.dataset.i;
      let j = i;
      if (e.key === 'ArrowRight') j = i + 1;
      else if (e.key === 'ArrowLeft') j = i - 1;
      else if (e.key === 'ArrowDown') j = i + geom.per;
      else if (e.key === 'ArrowUp') j = i - geom.per;
      else return;
      e.preventDefault();
      if (tubes[j]) tubes[j].el.focus({ preventScroll: true });
    });
    boardEl.addEventListener('animationend', function (e) {
      if (e.animationName === 'pop') { const t = e.target.closest('.tube'); if (t) t.classList.remove('pop'); }
    });

    $('btnHome').addEventListener('click', goHome);
    $('btnPrev').addEventListener('click', function () { stepLevel(-1); });
    $('btnNext').addEventListener('click', function () { stepLevel(1); });
    $('btnUndo').addEventListener('click', undo);
    $('btnHint').addEventListener('click', showHint);
    $('btnAdd').addEventListener('click', addTube);
    $('btnRestart').addEventListener('click', restart);
    $('chkSymbols').addEventListener('change', function (e) { S.symbols = e.target.checked; applyLook(); save(); });

    $('btnPlay').addEventListener('click', function () {
      Sound.get();
      show('game');
      refresh();
      if (tubes[0]) tubes[0].el.focus({ preventScroll: true });
    });
    $('btnSound').addEventListener('click', function () { S.sound = !S.sound; renderHome(); save(); if (S.sound) Sound.select(); });
    $('btnBuzz').addEventListener('click', function () { S.buzz = !S.buzz; renderHome(); save(); buzz(SND.buzzCork); });
    $('btnTubes').addEventListener('click', function () { openShop('tubes'); });
    $('btnThemes').addEventListener('click', function () { openShop('backdrops'); });
    $('btnAwards').addEventListener('click', openAwards);

    $('btnBack').addEventListener('click', function () { renderHome(); show('home'); $('btnPlay').focus({ preventScroll: true }); });
    document.querySelectorAll('.tab').forEach(function (tab) {
      tab.addEventListener('click', function () { shopTab = tab.dataset.tab; shopSay(''); renderShop(); });
    });
    $('shopGrid').addEventListener('click', function (e) {
      const card = e.target.closest('.card-btn');
      if (card) pickShopItem(card.dataset.id);
    });

    $('winHome').addEventListener('click', goHome);
    $('winNext').addEventListener('click', nextLevel);
    $('awardsClose').addEventListener('click', function () { closePop(awardsEl); });
    $('awardsScrim').addEventListener('click', function () { closePop(awardsEl); });
    document.addEventListener('keydown', function (e) {
      if (e.key !== 'Escape') return;
      if (awardsEl.classList.contains('on')) closePop(awardsEl);
      else if (currentScreen === 'shop') $('btnBack').click();
    });

    document.addEventListener('touchstart', function () {}, { passive: true });   // lets :active work on iOS
    window.addEventListener('resize', layout);
    if (window.ResizeObserver) new ResizeObserver(layout).observe(boardEl);
    window.addEventListener('pagehide', save);
  }

  function init() {
    applyText();
    applyImages();
    load();
    const firstVisit = !S.launched;
    S.launched = true;
    applyLook();
    bind();
    if (S.won || S.done) {             // closed on a finished level: carry on with the level still to clear
      S.level = reached();
      S.board = null; S.won = false; S.done = false;
    }
    openLevel(S.level, 'saved');
    renderHome();
    show(firstVisit ? 'game' : 'home');   // very first visit goes straight into level 1
  }

  init();
})();
</script>
</body>
</html>
